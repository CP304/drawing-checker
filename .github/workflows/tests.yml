name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Unter- und Obergrenze der unterstuetzten Fassungen
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Qt-Systembibliotheken
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 fonts-dejavu-core
      - name: OCR (Tesseract mit deutschem Sprachpaket)
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
      - name: Abhängigkeiten
        run: pip install -e .[occ,ocr,dev]
      - name: Wissenspakete validieren
        run: python -m drawing_checker.app --check-rules
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
